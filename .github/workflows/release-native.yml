name: Release Native macOS

on:
  push:
    tags:
      # Four-part native tags only (Electron uses v0.4.2).
      - "v[0-9]*.[0-9]*.[0-9]*.[0-9]*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Native tag to build (e.g. v0.1.4.1)"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-native-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  macos:
    name: Build native macOS app
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          persist-credentials: false

      - name: Validate native tag and architecture
        run: |
          if ! [[ "${RELEASE_TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Expected a four-part native tag, got ${RELEASE_TAG}"
            exit 1
          fi
          test "$(uname -m)" = "arm64"
          test -f scripts/native/package-standalone.sh

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Ensure native binaries
        run: |
          node node_modules/electron/install.js
          node -e "const p='@anthropic-ai/claude-agent-sdk-'+process.platform+'-'+process.arch; const f=require.resolve(p+'/claude'); if(!require('fs').existsSync(f)) process.exit(1); console.log(f)"

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Swift transcript check
        run: scripts/native/test-transcript.sh

      - name: Package native app
        env:
          DESK_NATIVE_VERSION: ${{ env.RELEASE_TAG }}
        run: scripts/native/package-standalone.sh

      - name: Archive app
        run: |
          cd release/native-arm64
          ditto -c -k --sequesterRsrc --keepParent \
            "3PI Desk Native.app" \
            "../3pi-desk-native-${RELEASE_TAG#v}-arm64.zip"
          cd ..
          shasum -a 256 "3pi-desk-native-${RELEASE_TAG#v}-arm64.zip" > SHA256SUMS-native
          ls -lh

      - name: Create or update draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            gh release upload "${RELEASE_TAG}" \
              release/*native*.zip \
              release/SHA256SUMS-native \
              LICENSE \
              THIRD_PARTY_NOTICES.md \
              --clobber
          else
            gh release create "${RELEASE_TAG}" \
              release/*native*.zip \
              release/SHA256SUMS-native \
              LICENSE \
              THIRD_PARTY_NOTICES.md \
              --draft \
              --title "3PI Desk Native ${RELEASE_TAG}" \
              --notes "Native macOS ARM64 preview. Unsigned and unnotarized; right-click → Open on first launch. See docs/MACOS-NATIVE.md."
          fi
