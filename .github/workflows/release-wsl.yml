name: Release WSL2

on:
  push:
    tags:
      - "wsl-v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-wsl-${{ github.ref }}
  cancel-in-progress: false

jobs:
  linux-wsl:
    name: Build WSL2 packages
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Ensure native binaries
        run: |
          # electronDist in electron-builder.yml requires this directory to exist.
          node node_modules/electron/install.js
          test -x node_modules/@anthropic-ai/claude-agent-sdk-linux-x64/claude

      - name: Resolve release tag
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            TAG="wsl-v${VERSION}"
          else
            TAG="${GITHUB_REF_NAME}"
            if [ "${TAG}" != "wsl-v${VERSION}" ]; then
              echo "::error::Tag ${TAG} does not match package.json version wsl-v${VERSION}."
              exit 1
            fi
          fi
          echo "TAG=${TAG}" >> "$GITHUB_ENV"

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build application
        run: npx electron-vite build

      - name: Package WSL2 AppImage and deb
        run: npx electron-builder --linux AppImage deb --config electron-builder.wsl.yml --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate checksums
        run: |
          cd release-wsl
          sha256sum *.AppImage *.deb > SHA256SUMS
          cat SHA256SUMS
          ls -lh *.AppImage *.deb

      - name: Create or update draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "${TAG}" >/dev/null 2>&1; then
            gh release upload "${TAG}" release-wsl/* --clobber
          else
            gh release create "${TAG}" \
              release-wsl/*.AppImage \
              release-wsl/*.deb \
              release-wsl/SHA256SUMS \
              LICENSE \
              THIRD_PARTY_NOTICES.md \
              --draft \
              --generate-notes \
              --title "3PI Desk for Claude Code ${TAG}"
          fi
