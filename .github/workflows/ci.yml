name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Typecheck and build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Guard against tracked build output
        run: |
          if git ls-files | grep -E '^(node_modules|out|release|dist)/'; then
            echo "::error::Build output or dependencies are tracked by git."
            exit 1
          fi

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npx electron-vite build
