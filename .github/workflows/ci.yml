name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Guard against tracked build output
        run: |
          if git ls-files | grep -E '(^|/)(node_modules|out|release|release-wsl|dist|\.cache|\.build|DerivedData|xcuserdata)/|\.(app|dSYM|xcresult)/|\.(dmg|xcuserstate)$'; then
            echo "::error::Build output or dependencies are tracked by git."
            exit 1
          fi

      - name: Guard against committed secrets
        run: |
          if git grep -nE 'sk-[A-Za-z0-9]{20,}|ghp_[A-Za-z0-9]{20,}|xox[baprs]-[A-Za-z0-9-]{10,}' -- . ':!package-lock.json'; then
            echo "::error::A potential secret was found in tracked files."
            exit 1
          fi

      - name: Audit production dependencies
        run: npm audit --omit=dev

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build
        run: npx electron-vite build

  verify-macos:
    name: Verify (macOS)
    runs-on: macos-latest
    timeout-minutes: 35

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Ensure native binaries
        run: |
          node node_modules/electron/install.js
          node -e "const p='@anthropic-ai/claude-agent-sdk-'+process.platform+'-'+process.arch; const f=require.resolve(p+'/claude'); if(!require('fs').existsSync(f)) process.exit(1); console.log(f)"

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build
        run: npx electron-vite build

      - name: Package (unsigned)
        run: npx electron-builder --mac dir --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
