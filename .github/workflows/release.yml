name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build and attach assets to (e.g. v0.4.2)"
        required: true
        type: string
      build_macos:
        description: "Build macOS dmg/zip (leave off until the macOS work is ready)"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  linux:
    name: Build Linux packages
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Ensure native binaries
        run: |
          # npm may skip lifecycle scripts on hardened CI runners; electronDist
          # in electron-builder.yml requires this directory to exist.
          node node_modules/electron/install.js
          test -x node_modules/@anthropic-ai/claude-agent-sdk-linux-x64/claude

      - name: Verify tag matches package version
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          if [ "v${VERSION}" != "${RELEASE_TAG}" ]; then
            echo "::error::Tag ${RELEASE_TAG} does not match package.json version v${VERSION}."
            exit 1
          fi

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build application
        run: npx electron-vite build

      - name: Package AppImage and deb
        run: npx electron-builder --linux AppImage deb --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate checksums
        run: |
          cd release
          sha256sum *.AppImage *.deb > SHA256SUMS
          cat SHA256SUMS
          ls -lh *.AppImage *.deb

      - name: Create or update draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            gh release upload "${RELEASE_TAG}" \
              release/*.AppImage \
              release/*.deb \
              release/SHA256SUMS \
              LICENSE \
              THIRD_PARTY_NOTICES.md \
              --clobber
          else
            gh release create "${RELEASE_TAG}" \
              release/*.AppImage \
              release/*.deb \
              release/SHA256SUMS \
              LICENSE \
              THIRD_PARTY_NOTICES.md \
              --draft \
              --generate-notes \
              --title "3PI Desk for Claude Code ${RELEASE_TAG}"
          fi

  macos:
    name: Build macOS packages
    needs: linux
    if: ${{ inputs.build_macos || vars.BUILD_MACOS == 'true' }}
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Ensure native binaries
        run: |
          node node_modules/electron/install.js
          node -e "const p='@anthropic-ai/claude-agent-sdk-'+process.platform+'-'+process.arch; const f=require.resolve(p+'/claude'); if(!require('fs').existsSync(f)) process.exit(1); console.log(f)"

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build application
        run: npx electron-vite build

      - name: Package dmg and zip (unsigned)
        run: npx electron-builder --mac dmg zip --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate checksums
        run: |
          cd release
          shasum -a 256 *.dmg *.zip > SHA256SUMS-macos
          cat SHA256SUMS-macos
          ls -lh *.dmg *.zip

      - name: Upload macOS artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${RELEASE_TAG}" \
            release/*.dmg \
            release/*.zip \
            release/SHA256SUMS-macos \
            --clobber

  wsl:
    name: Build WSL2 packages
    needs: linux
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Ensure native binaries
        run: |
          node node_modules/electron/install.js
          test -x node_modules/@anthropic-ai/claude-agent-sdk-linux-x64/claude

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build application
        run: npx electron-vite build

      - name: Package WSL2 AppImage and deb
        run: npx electron-builder --linux AppImage deb --config electron-builder.wsl.yml --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate checksums
        run: |
          cd release-wsl
          sha256sum *.AppImage *.deb > SHA256SUMS-wsl
          cat SHA256SUMS-wsl
          ls -lh *.AppImage *.deb

      - name: Upload WSL2 artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${RELEASE_TAG}" \
            release-wsl/*.AppImage \
            release-wsl/*.deb \
            release-wsl/SHA256SUMS-wsl \
            --clobber
