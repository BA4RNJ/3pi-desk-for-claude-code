name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  linux:
    name: Build Linux packages
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Ensure native binaries
        run: |
          # npm may skip lifecycle scripts on hardened CI runners; electronDist
          # in electron-builder.yml requires this directory to exist.
          node node_modules/electron/install.js
          test -x node_modules/@anthropic-ai/claude-agent-sdk-linux-x64/claude

      - name: Verify tag matches package version
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          if [ "v${VERSION}" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match package.json version v${VERSION}."
            exit 1
          fi

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build application
        run: npx electron-vite build

      - name: Package AppImage and deb
        run: npx electron-builder --linux AppImage deb --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate checksums
        run: |
          cd release
          sha256sum *.AppImage *.deb > SHA256SUMS
          cat SHA256SUMS
          ls -lh *.AppImage *.deb

      - name: Create draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            release/*.AppImage \
            release/*.deb \
            release/SHA256SUMS \
            LICENSE \
            THIRD_PARTY_NOTICES.md \
            --draft \
            --generate-notes \
            --title "3PI Desk for Claude Code ${GITHUB_REF_NAME}"
