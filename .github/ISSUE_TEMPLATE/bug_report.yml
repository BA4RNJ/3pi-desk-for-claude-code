name: Bug report
description: Report a reproducible problem in 3PI Desk for Claude Code
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. Please remove API keys, tokens, private paths, and chat
        content from logs and screenshots before submitting.

        For security vulnerabilities, **do not open an issue** — use the private reporting
        instructions in SECURITY.md.
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open ...
        2. Select ...
        3. See ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: input
    id: app-version
    attributes:
      label: App version
      description: Shown in Settings → About.
      placeholder: "0.4.3"
    validations:
      required: true
  - type: input
    id: cli-version
    attributes:
      label: Claude Code CLI version
      description: Shown in Settings → About.
      placeholder: "2.1.316"
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: "Ubuntu 24.04, GNOME, X11/Wayland"
    validations:
      required: true
  - type: input
    id: provider
    attributes:
      label: Provider / model
      description: Provider preset or custom endpoint, and the model ID.
      placeholder: "OpenCode Go / deepseek-v4.1-flash"
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or screenshots
      description: Redact API keys, tokens, private paths, and chat content.
      render: shell
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues and did not find a duplicate.
          required: true
        - label: I removed API keys, tokens, and private data from this report.
          required: true
