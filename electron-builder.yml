appId: local.3pidesk
productName: 3PI Desk for Claude Code
copyright: Copyright © 2026 BA4RNJ
electronDist: node_modules/electron/dist
directories:
  output: release
  buildResources: build
files:
  - "!src/**"
  - "!docs/**"
  - "!README.md"
  - "!AGENTS.md"
  - "!scripts/**"
  - "!electron.vite.config.ts"
  - "!tsconfig*.json"
  - "!build/**"
  - "!release/**"
  - "!.git/**"
  - "!*.log"
asarUnpack:
  - node_modules/@anthropic-ai/**
extraResources:
  - from: resources/icon.png
    to: icon.png
  - from: resources/trayTemplate.png
    to: trayTemplate.png
  - from: resources/trayTemplate@2x.png
    to: trayTemplate@2x.png
  - from: LICENSE
    to: LICENSE.txt
  - from: THIRD_PARTY_NOTICES.md
    to: THIRD_PARTY_NOTICES.md
npmRebuild: false
linux:
  target:
    - AppImage
    - deb
  category: Development
  icon: build/icon.png
  executableName: 3pi-desk
  syncDesktopName: true
  artifactName: 3pi-desk-${version}-${arch}.${ext}
  maintainer: BA4RNJ <BA4RNJ@users.noreply.github.com>
  vendor: BA4RNJ
  synopsis: 3PI Desk for Claude Code
  description: 3PI Desk for Claude Code - a local GUI for Claude Code powered by the Claude Agent SDK.
mac:
  target:
    - dmg
    - zip
  category: public.app-category.developer-tools
  icon: build/icon.png
  artifactName: 3pi-desk-${version}-${arch}.${ext}
  hardenedRuntime: true
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  darkModeSupport: true
  extendInfo:
    CFBundleDisplayName: 3PI Desk for Claude Code
    NSHumanReadableCopyright: Copyright © 2026 BA4RNJ
