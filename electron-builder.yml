appId: local.3pidesk
productName: 3PI Desk for Claude Code
copyright: Copyright © 2026 BA4RNJ
electronDist: node_modules/electron/dist
compression: maximum
# Chromium ships ~55 locale packs; the app only uses English and Chinese.
electronLanguages:
  - en-US
  - zh-CN
directories:
  output: release
  buildResources: build
files:
  - "!src/**"
  - "!apps/**"
  - "!packages/**"
  - "!docs/**"
  - "!README.md"
  - "!AGENTS.md"
  - "!scripts/**"
  - "!electron.vite.config.ts"
  - "!tsconfig*.json"
  - "!build/**"
  - "!release/**"
  - "!release-wsl/**"
  - "!promo/**"
  - "!.cache/**"
  - "!.git/**"
  - "!*.log"
  # Default (slim) build: the Claude Code CLI is resolved from the user's
  # installation or downloaded on first run. Use electron-builder.offline.yml
  # to produce a build that bundles the platform CLI.
  - "!node_modules/@anthropic-ai/claude-agent-sdk-*/**"
asarUnpack:
  - node_modules/@anthropic-ai/**
extraResources:
  - from: resources/icon.png
    to: icon.png
  - from: resources/trayTemplate.png
    to: trayTemplate.png
  - from: resources/trayTemplate@2x.png
    to: trayTemplate@2x.png
  - from: LICENSE
    to: LICENSE.txt
  - from: THIRD_PARTY_NOTICES.md
    to: THIRD_PARTY_NOTICES.md
npmRebuild: false
linux:
  target:
    - AppImage
    - deb
  category: Development
  icon: build/icon.png
  executableName: 3pi-desk
  syncDesktopName: true
  artifactName: 3pi-desk-${version}-linux-${arch}.${ext}
  maintainer: BA4RNJ <BA4RNJ@users.noreply.github.com>
  vendor: BA4RNJ
  synopsis: 3PI Desk for Claude Code
  description: 3PI Desk for Claude Code - a local GUI for Claude Code powered by the Claude Agent SDK.
mac:
  target:
    - dmg
    - zip
  category: public.app-category.developer-tools
  icon: build/icon.png
  artifactName: 3pi-desk-${version}-macos-${arch}.${ext}
  hardenedRuntime: true
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  darkModeSupport: true
  extendInfo:
    CFBundleDisplayName: 3PI Desk for Claude Code
    NSHumanReadableCopyright: Copyright © 2026 BA4RNJ
